<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 매트블랙 배경 -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a"/>
  <!-- 골드 테두리 -->
  <rect x="3" y="3" width="506" height="506" rx="110" fill="none" stroke="#c9a84c" stroke-width="8" stroke-opacity="0.55"/>
  <!-- 중앙 미세 골드 헤일로 -->
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="112" fill="url(#halo)"/>
  <!-- PM 텍스트 -->
  <text
    x="256" y="308"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="230"
    font-weight="700"
    fill="#c9a84c"
    text-anchor="middle"
    letter-spacing="-10">PM</text>
  <!-- 하단 장식선 -->
  <line x1="148" y1="345" x2="364" y2="345" stroke="#c9a84c" stroke-width="2.5" stroke-opacity="0.38"/>
</svg>
