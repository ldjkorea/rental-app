<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;display=swap');
    </style>
    <radialGradient id="g" cx="50%" cy="50%" r="44%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a"/>
  <!-- 헤일로 -->
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!-- 외곽 테두리 -->
  <rect x="3" y="3" width="506" height="506" rx="110" fill="none" stroke="#c9a84c" stroke-width="6" stroke-opacity="0.52"/>
  <!-- 내곽 테두리 -->
  <rect x="16" y="16" width="480" height="480" rx="97" fill="none" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.15"/>

  <!-- 상단 장식 -->
  <line x1="140" y1="152" x2="214" y2="152" stroke="#c9a84c" stroke-width="1.2" stroke-opacity="0.4"/>
  <polygon points="256,140 264,153 256,166 248,153" fill="#c9a84c" fill-opacity="0.5"/>
  <line x1="298" y1="152" x2="372" y2="152" stroke="#c9a84c" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- PM 필기체 -->
  <text
    x="256" y="334"
    font-family="'Dancing Script', cursive"
    font-size="252"
    font-weight="700"
    fill="#c9a84c"
    text-anchor="middle"
    opacity="0.92">PM</text>

  <!-- 하단 장식 -->
  <line x1="140" y1="376" x2="214" y2="376" stroke="#c9a84c" stroke-width="1.2" stroke-opacity="0.4"/>
  <polygon points="256,364 264,377 256,390 248,377" fill="#c9a84c" fill-opacity="0.44"/>
  <line x1="298" y1="376" x2="372" y2="376" stroke="#c9a84c" stroke-width="1.2" stroke-opacity="0.4"/>
</svg>
